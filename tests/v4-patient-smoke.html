<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTOR V4 - pruebas aisladas</title>
<style>body{font:16px system-ui;margin:2rem;max-width:720px}button{padding:.6rem;margin:.3rem}#results p{padding:.5rem;border-bottom:1px solid #ddd}.ok{color:green}.fail{color:#b00}</style></head>
<body><h1>ASTOR V4: prueba aislada del modo paciente</h1>
<p>Esta página utiliza únicamente datos sintéticos. No carga Supabase, no accede a expedientes y no modifica la aplicación publicada.</p>
<header class="topbar"><h2>Evaluación clínica</h2></header>
<nav><button class="nav-item">Pacientes</button><button class="nav-item">Panel profesional</button><button class="nav-item">Datos del paciente</button></nav>
<button id="astorCloudSyncBtn" type="button">Nube</button>
<section class="view active-view"><h2>Datos del paciente</h2><input aria-label="Campo de prueba"></section>
<div id="results" role="status"></div>
<script src="patient.menu.guard.js"></script>
<script src="patient.v4.progress.safe.js"></script>
<script>
(function(){
"use strict";
const results=document.getElementById("results");
const checks=[];
const assert=(name,condition)=>checks.push({name,ok:!!condition});
setTimeout(()=>{
const menu=[...document.querySelectorAll(".nav-item")].find(el=>el.textContent==="Pacientes");
assert("Menú interno oculto",menu?.getAttribute("aria-hidden")==="true"&&menu.style.display==="none");
assert("Indicador de avance visible",!!document.getElementById("astorV4Progress"));
assert("Sin caso clínico real: avance no completado",document.getElementById("astorV4Progress")?.textContent.includes("0%"));
const n=document.createElement("button");n.className="nav-item";n.textContent="Pedidos";document.querySelector("nav").append(n);
setTimeout(()=>{
assert("Nuevo elemento interno oculto",n.getAttribute("aria-hidden")==="true");
results.replaceChildren();
checks.forEach(c=>{const p=document.createElement("p");p.className=c.ok?"ok":"fail";p.textContent=(c.ok?"APROBADO: ":"FALLÓ: ")+c.name;results.append(p)});
const p=document.createElement("p");p.textContent=checks.filter(x=>x.ok).length+"/"+checks.length+" verificaciones aprobadas";results.prepend(p);
},150);
},150);
})();
</script></body></html>
